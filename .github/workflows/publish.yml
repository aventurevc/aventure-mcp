name: publish

run-name: publish ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# The aVenture release train attaches the frozen package tarball to this repository's
# v<version> release, then dispatches this workflow with that tarball's integrity.
# npm trusted publishing authenticates this workflow through GitHub OIDC, so no npm
# token exists anywhere in this repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version; its v<version> release carries the frozen tarball
        required: true
        type: string
      integrity:
        description: Expected npm dist.integrity of that tarball (sha512-<base64>)
        required: true
        type: string
      dry_run:
        description: Prove the toolchain and OIDC identity, then stop before reading the release
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    # npm trusted publishing accepts only GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_NAME: "@aventurevc/mcp-server"
      VERSION: ${{ inputs.version }}
      INTEGRITY: ${{ inputs.integrity }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check inputs and the npm trusted-publishing floor
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $VERSION"; exit 1; }
          [[ "$INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]{86}==$ ]] || { echo "invalid integrity: $INTEGRITY"; exit 1; }
          npm_version="$(npm --version)"
          printf '11.5.1\n%s\n' "$npm_version" | sort -V -C || { echo "npm $npm_version is older than 11.5.1"; exit 1; }
          echo "node $(node --version), npm $npm_version"
      - name: Mint the npm OIDC identity token
        run: |
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -er .value)"
          echo "::add-mask::$token"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq -e '{aud, repository, ref, workflow_ref, runner_environment} | select(.aud == "npm:registry.npmjs.org" and .runner_environment == "github-hosted")'
      - name: Fetch and verify the frozen tarball
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern '*.tgz' --dir "$RUNNER_TEMP/package"
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/package/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || { echo "release v$VERSION must carry exactly one .tgz asset"; exit 1; }
          actual="sha512-$(openssl dgst -sha512 -binary "${tarballs[0]}" | base64 -w0)"
          [ "$actual" = "$INTEGRITY" ] || { echo "tarball integrity $actual differs from $INTEGRITY"; exit 1; }
          manifest="$(tar -xzOf "${tarballs[0]}" package/package.json)"
          [ "$(jq -r '.name + "@" + .version' <<<"$manifest")" = "$PACKAGE_NAME@$VERSION" ] || { echo "tarball is not $PACKAGE_NAME@$VERSION"; exit 1; }
          echo "TARBALL=${tarballs[0]}" >>"$GITHUB_ENV"
      - name: Publish through npm trusted publishing
        if: ${{ !inputs.dry_run }}
        run: npm publish "$TARBALL" --provenance --access public --ignore-scripts --registry https://registry.npmjs.org/
