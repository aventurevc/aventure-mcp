name: received-package
run-name: ${{ github.event_name == 'workflow_dispatch' && format('received-package {0}', inputs.source_sha) || '' }}

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA of the immutable package to test
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.source_sha }}

# Push and dispatch runs keep separate groups; only newer PR runs cancel older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      package: ${{ steps.changed.outputs.package }}
    steps:
      - name: Validate the immutable package SHA
        if: github.event_name == 'workflow_dispatch'
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - id: changed
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
            echo "package=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "package=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          if grep -qE '^(package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|\.npmrc|\.gitignore|dist/|scripts/|\.github/workflows/)' <<<"$changed"; then
            echo "package=true" >>"$GITHUB_OUTPUT"
          else
            grep -vE '^(README\.md|LICENSE|server\.json|glama\.json|\.mcp\.json|skills/)' <<<"$changed" && exit 1
            echo "package=false" >>"$GITHUB_OUTPUT"
          fi

  package:
    needs: select
    if: needs.select.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify the requested package commit
        if: github.event_name == 'workflow_dispatch'
        run: '[ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pack and install the exact package
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          prefix="$RUNNER_TEMP/prefix"
          mkdir -p "$prefix"
          npm install -g --prefix "$prefix" --ignore-scripts "$RUNNER_TEMP"/aventurevc-mcp-server-*.tgz
          echo "SERVER_BIN=$prefix/bin/aventure-mcp-server" >>"$GITHUB_ENV"
      - name: Smoke the installed server transport
        run: scripts/smoke-installed-server.sh "$SERVER_BIN"
      - name: Verify the immutable public API reference
        run: |
          reference="$(jq -ce ' .aventurePublicApi | select(.repository == "aventurevc/aventure-docs" and .openapiPath == "openapi/openapi.json" and (.commit | test("^[0-9a-f]{40}$")) and (.openapiSha256 | test("^[0-9a-f]{64}$")))' package.json)"
          repository="$(jq -r .repository <<<"$reference")"
          commit="$(jq -r .commit <<<"$reference")"
          path="$(jq -r .openapiPath <<<"$reference")"
          sha256="$(jq -r .openapiSha256 <<<"$reference")"
          curl -fsSL "https://raw.githubusercontent.com/$repository/$commit/$path" -o "$RUNNER_TEMP/openapi.json"
          echo "$sha256  $RUNNER_TEMP/openapi.json" | sha256sum -c -
          [ "$(jq -r .info.version "$RUNNER_TEMP/openapi.json")" = "$(node -p 'require("./package.json").version')" ]

  required:
    needs: [select, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          selected='${{ needs.select.outputs.package }}'
          result='${{ needs.package.result }}'
          [ '${{ needs.select.result }}' = success ] || exit 1
          if [ "$selected" = true ]; then [ "$result" = success ]; else [ "$result" = skipped ]; fi
